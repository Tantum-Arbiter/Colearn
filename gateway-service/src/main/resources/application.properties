# gateway-service/src/main/resources/application.properties
spring.application.name=gateway-service


server.shutdown=graceful
server.port=8080
server.address=0.0.0.0


# Same port: DO NOT set management.server.port/address
management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# Disable custom health indicators from Actuator to prevent startup blocking
# They are still available via /private/healthcheck endpoint
management.health.firestoreHealth.enabled=false
management.health.gcsHealth.enabled=false


info.app.name=Gateway Service
info.app.description=spring application
info.app.version=1.0.0

# Default CORS Configuration (overridden by profile-specific configs)
cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,exp://localhost:*,exp://127.0.0.1:*,http://host.docker.internal:*,https://app.colearnwithfreya.co.uk,https://www.colearnwithfreya.co.uk,https://assets.colearnwithfreya.co.uk
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600
# RevenueCat lookups (Phase E, PHASE-8 §7). With no key every lookup counts as unavailable.
app.revenuecat.api-url=${REVENUECAT_API_URL:https://api.revenuecat.com}
app.revenuecat.secret-api-key=${REVENUECAT_SECRET_API_KEY:}
# TestFlight purchases are sandbox purchases; set false once the app is in the stores.
app.revenuecat.accept-sandbox=${REVENUECAT_ACCEPT_SANDBOX:true}
# An ISO instant: every saved entitlement checked before it is ignored and fetched again (recovery lever).
app.entitlements.cache-epoch=${ENTITLEMENTS_CACHE_EPOCH:}
resilience4j.circuitbreaker.instances.revenuecat.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.revenuecat.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.revenuecat.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.revenuecat.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.revenuecat.sliding-window-size=10
resilience4j.circuitbreaker.instances.revenuecat.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.revenuecat.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.revenuecat.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.revenuecat.automatic-transition-from-open-to-half-open-enabled=true
# Off: /download only logs what it would refuse. Turn on once the webhook is live and the app logs RevenueCat in with the account id.
app.entitlements.enforce=${ENTITLEMENTS_ENFORCE:false}

# How long proof of consent is kept after an account is deleted (consent_log; Firestore TTL removes it).
app.consent-log.retention-days=${CONSENT_LOG_RETENTION_DAYS:1095}
