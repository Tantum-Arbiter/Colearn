appId: com.growwithfreya.app
tags:
  - smoke
name: The flag on home switches the app's language, and it sticks
---
- runFlow: ../../helpers/start-seeded.yaml
- tapOn:
    id: "home-language-button"
- assertVisible:
    id: "language-picker"
- tapOn:
    id: "language-option-de"
- assertNotVisible:
    id: "language-picker"
- stopApp
- launchApp
- runFlow: ../../helpers/dismiss-interruptions.yaml
- extendedWaitUntil:
    visible: "Fortschritt"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "home-language-button"
    timeout: 60000
- tapOn:
    id: "home-language-button"
- tapOn:
    id: "language-option-en"
- stopApp
- launchApp
- runFlow: ../../helpers/dismiss-interruptions.yaml
- extendedWaitUntil:
    visible: "Progress"
    timeout: 90000
