appId: com.growwithfreya.app
tags:
  - smoke
name: The flag on home switches the app's language
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-language-button"
    timeout: 90000
- runFlow: ../../helpers/dismiss-interruptions.yaml
- tapOn:
    id: "home-language-button"
- assertVisible:
    id: "language-picker"
- tapOn:
    id: "language-option-de"
- assertNotVisible:
    id: "language-picker"
- tapOn:
    id: "home-language-button"
- tapOn:
    id: "language-option-en"
- assertNotVisible:
    id: "language-picker"
