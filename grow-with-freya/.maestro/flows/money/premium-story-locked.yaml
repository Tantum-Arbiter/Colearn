appId: com.growwithfreya.app
tags:
  - journey
name: A story beyond the free plan wears a lock
---
- runFlow:
    file: ../../helpers/start-seeded.yaml
    env:
      SEED: "onboarded=1&signedIn=1&tutorials=done&screenTime=reset&language=en&tier=free"
- tapOn:
    id: "navigation-item-search"
- extendedWaitUntil:
    visible:
      id: "catalogue-header-row"
    timeout: 30000
- tapOn: "Search for a story"
- inputText: "Locked Lantern"
- pressKey: Enter
- extendedWaitUntil:
    visible: "The Locked Lantern"
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "story-cover-lock"
          timeout: 30000
- retry:
    maxRetries: 2
    commands:
      - tapOn: "The Locked Lantern"
      - extendedWaitUntil:
          visible:
            id: "trial-scroller"
          timeout: 15000
- assertNotVisible:
    id: "story-card-sheet"
- tapOn:
    id: "trial-close"
- extendedWaitUntil:
    notVisible:
      id: "trial-scroller"
    timeout: 30000
