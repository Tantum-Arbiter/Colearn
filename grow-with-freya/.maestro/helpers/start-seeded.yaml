appId: com.growwithfreya.app
name: Start the app in the state the calling flow asked for
# The caller passes SEED. A default here would silently win over it -- Maestro
# gives a flow's own env precedence over the env it is called with, so a flow
# that set its own seed would quietly run with this one instead.
---
# Whatever the last flow left behind: a phone starts upright.
- setOrientation: PORTRAIT
# A flow starts from a stopped app, not from wherever the last one left it.
- stopApp
- launchApp
- openLink: "com.growwithfreya.app://?e2e=1&${SEED}"
# iOS may ask "Open in <app>?" first; on CI nobody is there to answer it.
- tapOn:
    text: "Open"
    optional: true
# Where the app opens is decided as it starts, so it starts again with the
# seeded state in hand: a flow that ran before this one may have left it in
# onboarding, in a story, or signed in as somebody else. The wait gives the
# state time to be written before the app is stopped.
- extendedWaitUntil:
    visible:
      id: "nothing-waits-here"
    timeout: 8000
    optional: true
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-language-button"
    timeout: 90000
# The bar is published by the page after it mounts, and the seeding link makes
# the page render again. Waiting for it keeps a flow from reaching for the bar
# while the screen is still settling.
- extendedWaitUntil:
    visible:
      id: "navigation-item-home"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
