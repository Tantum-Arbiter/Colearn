appId: com.growwithfreya.app
name: Start the app in the state the calling flow asked for
# The caller passes SEED. A default here would silently win over it -- Maestro
# gives a flow's own env precedence over the env it is called with, so a flow
# that set its own seed would quietly run with this one instead.
---
# Whatever the last flow left behind: a phone starts upright.
- setOrientation: PORTRAIT
- launchApp
- openLink: "com.growwithfreya.app://?e2e=1&${SEED}"
- extendedWaitUntil:
    visible:
      id: "home-language-button"
    timeout: 90000
# The bar is published by the page after it mounts, and the seeding link makes
# the page render again. Waiting for it keeps a flow from reaching for the bar
# while the screen is still settling.
- extendedWaitUntil:
    visible:
      id: "navigation-item-home"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
