appId: com.growwithfreya.app
name: Clear anything the app puts in front of the page
---
- repeat:
    times: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 4000
      - runFlow:
          when:
            visible:
              id: "screen-time-owl-close"
          commands:
            - tapOn:
                id: "screen-time-owl-close"
      - runFlow:
          when:
            visible:
              id: "owl-guide-close"
          commands:
            - tapOn:
                id: "owl-guide-close"
