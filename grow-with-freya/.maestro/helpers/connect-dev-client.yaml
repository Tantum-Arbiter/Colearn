appId: com.growwithfreya.app
name: Point the development build at the bundler, and wait for the app to load
# iOS asks "Open in <app>?" before it hands a link to an app. On a laptop someone
# taps Open; on a CI simulator nobody does, the development build stays on its
# launcher, and every flow then fails on its first check. This taps it. The dev
# client remembers the bundler afterwards, so flows can stop and relaunch freely.
---
- launchApp
# Each platform's development build answers a different scheme.
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink: "com.growwithfreya.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: "exp+grow-with-freya://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
- tapOn:
    text: "Open"
    optional: true
- repeat:
    while:
      visible: "Enter URL manually"
    times: 4
    commands:
      - extendedWaitUntil:
          notVisible:
            text: "Enter URL manually"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: "Enter URL manually"
            notVisible: "There was a problem loading the project."
          commands:
            - runFlow:
                when:
                  platform: iOS
                commands:
                  - openLink: "com.growwithfreya.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
            - runFlow:
                when:
                  platform: Android
                commands:
                  - openLink: "exp+grow-with-freya://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
            - tapOn:
                text: "Open"
                optional: true
      - runFlow:
          when:
            visible: "There was a problem loading the project."
          commands:
            - tapOn: "Reload"
- extendedWaitUntil:
    notVisible:
      text: "Enter URL manually"
    timeout: 240000
