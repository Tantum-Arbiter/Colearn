name: Grow with Freya - CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, mvp, develop ]
    paths:
      - 'grow-with-freya/**'
      - '.github/workflows/grow-with-freya-ci-cd.yml'
  pull_request:
    branches: [ main, mvp, develop ]
    paths:
      - 'grow-with-freya/**'
      - '.github/workflows/grow-with-freya-ci-cd.yml'

# CRITICAL: Prevent multiple simultaneous runs
concurrency:
  group: grow-with-freya-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: grow-with-freya
  NODE_VERSION: '20'

jobs:
  # Job 1: Code Quality & Testing
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint (no errors, and no more warnings than the 501 there are today)
        run: npm run lint -- --max-warnings 501

      - name: Run tests with coverage
        id: test_run
        run: npm run test:ci -- --reporters=default --reporters=jest-junit
        env:
          CI: true
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=4096'
          JEST_JUNIT_OUTPUT_DIR: ${{ runner.temp }}/jest
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      - name: Summarise the tests and coverage
        if: always()
        run: |
          python3 ../.github/scripts/junit-summary.py --title "Unit tests" --report "$RUNNER_TEMP/jest/junit.xml"
          if [ -f coverage/coverage-summary.json ]; then
            python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          total = json.load(open("coverage/coverage-summary.json"))["total"]
          kinds = ("statements", "branches", "functions", "lines")
          print("Coverage: " + ", ".join("%s %s%%" % (k, total[k]["pct"]) for k in kinds))
          PY
          fi

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-${{ github.sha }}
          path: |
            ${{ runner.temp }}/jest/junit.xml
            ${{ env.WORKING_DIRECTORY }}/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 30


  # Job 2: TypeScript Type Checking
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npm run type-check

  # Job 3: Security & Dependency Audi
  security-audit:
    name: Security Audit (informational)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (informational, never fails)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          python3 ../.github/scripts/audit-summary.py "$RUNNER_TEMP/npm-audit.json"

      - name: Check for outdated packages
        run: npm outdated || echo "Package check completed"

  # Job 4: Build the Android app the journeys drive
  # Paused with the journeys (operator, 2026-09-23): runs only when started by hand.
  # The same E2E release build the nightly tests (app-e2e-build-android.yml): keyed on the
  # app's source, so a source that was built once, here or by the nightly, is reused
  # rather than built again. A build saved on main is shared with every pull request,
  # one saved in a pull request only with that PR.
  build-android:
    name: Build Android App
    needs: [security-audit, test-and-lint, type-check]
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/app-e2e-build-android.yml

  # Job 5: App Journeys (Maestro on an Android emulator)
  # Paused (operator, 2026-09-23): runs only when started by hand, until it is worth
  # gating pull requests into main on it again.
  # The layer above unit tests: the real app, on a device, doing what a family does.
  # It runs the smoke flows against exactly the app built above (app-e2e-journeys-android.yml
  # fetches it by key and never builds), and only once the tests, lint and type check
  # have passed: the build starts early, the emulator waits for the gate. Every journey
  # runs nightly on Android and iOS (app-e2e-nightly.yml), where macOS minutes cost
  # roughly ten times as much.
  app-journeys:
    name: App Journeys (smoke)
    needs: [build-android]
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/app-e2e-journeys-android.yml
    with:
      app-key: ${{ needs.build-android.outputs.app-key }}
      tags: smoke

  # Job 6: Build Web Application
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: [security-audit, test-and-lint, type-check]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo doctor check
        run: npx expo-doctor || echo "Expo doctor found issues but continuing build..."
        continue-on-error: true

      - name: Export for web
        run: npx expo export --platform web

      - name: Check the bundle can actually run
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if grep -rl "import\.meta" dist/_expo/static/js/web/ >/dev/null 2>&1; then
            echo "The web bundle contains import.meta, which a classic script cannot parse:" >&2
            echo "the app will stop at the splash. See babel.config.js unstable_transformImportMeta." >&2
            exit 1
          fi
          echo "The web bundle has no import.meta, so a classic script can run it."

      - name: Archive web build
        uses: actions/upload-artifact@v7
        with:
          name: expo-web-build-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist
          retention-days: 30

  # Job 7: Performance Testing
  # Runs after web build completes
  performance-test:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [build-web]
    if: needs.build-web.result == 'success'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: expo-web-build-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist

      - name: Setup Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Run Lighthouse CI (accessibility below 0.9 fails; the other scores warn)
        run: lhci autorun

      - name: Summarise the scores
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json
          runs = sorted(glob.glob(".lighthouseci/lhr-*.json"))
          print("### Lighthouse")
          print()
          if not runs:
              print("No Lighthouse result was written.")
          else:
              cats = ["performance", "accessibility", "best-practices", "seo", "pwa"]
              print("| Run | " + " | ".join(cats) + " |")
              print("|---|" + "---|" * len(cats))
              for i, path in enumerate(runs, 1):
                  c = json.load(open(path)).get("categories", {})
                  print(f"| {i} | " + " | ".join(str(round((c.get(k) or {}).get("score") or 0, 2)) for k in cats) + " |")
          PY

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/.lighthouseci
            ${{ env.WORKING_DIRECTORY }}/lighthouse-report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # Job 8: Deployment Summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [test-and-lint, type-check, security-audit, build-android, app-journeys, build-web, performance-test]
    if: always()

    steps:
      - name: Create deployment summary
        env:
          TESTS: ${{ needs.test-and-lint.result }}
          TYPES: ${{ needs.type-check.result }}
          AUDIT: ${{ needs.security-audit.result }}
          WEB: ${{ needs.build-web.result }}
          LIGHTHOUSE: ${{ needs.performance-test.result }}
          ANDROID_BUILD: ${{ needs.build-android.result }}
          JOURNEYS: ${{ needs.app-journeys.result }}
        run: |
          shown() { if [ "$1" = "skipped" ]; then echo "skipped (paused: runs when started by hand)"; else echo "$1"; fi; }
          {
            echo "## Grow with Freya - CI/CD Summary"
            echo ""
            echo "Commit \`${GITHUB_SHA:0:8}\`"
            echo ""
            echo "| Stage | Job | Result |"
            echo "|---|---|---|"
            echo "| 1 checks | Test & Lint | $TESTS |"
            echo "| 1 checks | TypeScript | $TYPES |"
            echo "| 1 checks | Security audit (informational) | $AUDIT |"
            echo "| 2 build | Web build | $WEB |"
            echo "| 2 build | Android E2E app | $(shown "$ANDROID_BUILD") |"
            echo "| 3 test | Lighthouse | $LIGHTHOUSE |"
            echo "| 3 test | Smoke journeys | $(shown "$JOURNEYS") |"
            echo ""
            if [ "$TESTS" = success ] && [ "$TYPES" = success ] && [ "$WEB" = success ] && [ "$LIGHTHOUSE" = success ] \
              && [ "$ANDROID_BUILD" != failure ] && [ "$JOURNEYS" != failure ] && [ "$JOURNEYS" != cancelled ]; then
              echo "### Release readiness"
              echo "Every gate that ran passed for this commit."
              if [ "$JOURNEYS" = success ]; then
                echo "The smoke journeys ran against this commit's app and passed."
              else
                echo "**The smoke journeys did not run.** Check the nightly journeys for this commit before releasing."
              fi
            else
              echo "### Not ready to release"
              echo "A gate failed or was cancelled: see the table above."
            fi
            echo ""
            echo "### Kept with this run"
            echo "- Unit test report and coverage summary (30 days)"
            echo "- Lighthouse report (30 days)"
            echo "- Web build (30 days)"
            if [ "$JOURNEYS" = success ] || [ "$JOURNEYS" = failure ]; then echo "- Journeys report (30 days)"; fi
            echo ""
            echo "### Quick Links"
            echo "- [Commit](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "- [EAS Builds](https://expo.dev/accounts/tantum-arbiter/projects/grow-with-freya/builds)"
          } >> "$GITHUB_STEP_SUMMARY"
