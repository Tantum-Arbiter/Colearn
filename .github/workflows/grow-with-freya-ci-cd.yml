name: Grow with Freya - CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, mvp, develop ]
    paths:
      - 'grow-with-freya/**'
      - '.github/workflows/grow-with-freya-ci-cd.yml'
  pull_request:
    branches: [ main, mvp, develop ]
    paths:
      - 'grow-with-freya/**'
      - '.github/workflows/grow-with-freya-ci-cd.yml'

# CRITICAL: Prevent multiple simultaneous runs
concurrency:
  group: grow-with-freya-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: grow-with-freya
  NODE_VERSION: '20'

jobs:
  # Job 1: Code Quality & Testing
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        id: test_run
        run: npm run test:ci
        env:
          CI: true
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=4096'


  # Job 2: TypeScript Type Checking
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npm run type-check

  # Job 3: Security & Dependency Audi
  security-audit:
    name: Security Audit (informational)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Audit found issues but continuing (known React version conflict)"
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || echo "Package check completed"

  # Job 4: Build the Android app the journeys drive
  # Starts at once, alongside the checks. The journeys load their JavaScript from Metro,
  # so the app only needs building when a native input changes; otherwise the build
  # saved for those inputs is reused. A build saved on main is shared with every pull
  # request, one saved in a pull request only with that PR, so pushes to main build
  # (when native inputs changed) to keep one every PR into main can reuse.
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reuse the app built from the same native inputs
        id: apk
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk/debug/app-debug.apk
          key: journeys-apk-${{ runner.os }}-${{ hashFiles('grow-with-freya/package.json', 'grow-with-freya/package-lock.json', 'grow-with-freya/app.config.js', 'grow-with-freya/assets/images/icon.png', 'grow-with-freya/assets/images/android-icon-*.png', 'grow-with-freya/assets/images/splash-icon.png') }}

      - name: Free disk the build needs
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/boost
          df -h /

      - name: Setup Node.js
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --legacy-peer-deps

      - name: Generate the Android project
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle's downloads
        if: steps.apk.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build the app
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64 2>&1 \
            | grep --line-buffered -v 'amazon-appstore-sdk.*Expected stack map table'

      - name: Hand the app to the journeys
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # Job 5: App Journeys (Maestro on an Android emulator)
  # The layer above unit tests: the real app, on a device, doing what a family does.
  # It gates pull requests into main, the release branch, rather than every push to
  # mvp. It runs on a fresh runner with the app built above, so the emulator has the
  # disk to itself. Every journey runs nightly on Android and iOS (app-e2e-nightly.yml),
  # where macOS minutes cost roughly ten times as much.
  app-journeys:
    name: App Journeys (smoke)
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    timeout-minutes: 30
    env:
      MAESTRO_VERSION: '2.10.0'
      EXPO_PUBLIC_E2E: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM, so the emulator is not unbearably slow
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci --legacy-peer-deps

      - name: Install Maestro
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> $GITHUB_PATH

      - name: Fetch the built app
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/android/app/build/outputs/apk/debug

      - name: Serve the bundle
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npx expo start --dev-client --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/status | grep -q running && break
            sleep 2
          done

      - name: Run the smoke journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r grow-with-freya/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            adb shell am start -a android.intent.action.VIEW -d 'com.growwithfreya.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
            sleep 30
            cd grow-with-freya && ./.maestro/run.sh --include-tags=smoke

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.sha }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/metro.log
          retention-days: 7

  # Job 6: Build Web Application
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: [test-and-lint, type-check, security-audit]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo doctor check
        run: npx expo-doctor || echo "Expo doctor found issues but continuing build..."
        continue-on-error: true

      - name: Export for web
        run: npx expo export --platform web

      - name: Check the bundle can actually run
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if grep -rl "import\.meta" dist/_expo/static/js/web/ >/dev/null 2>&1; then
            echo "The web bundle contains import.meta, which a classic script cannot parse:" >&2
            echo "the app will stop at the splash. See babel.config.js unstable_transformImportMeta." >&2
            exit 1
          fi

      - name: Archive web build
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-build-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist
          retention-days: 30

  # Job 7: Performance Testing
  # Runs after web build completes
  performance-test:
    name: Performance Tests (informational)
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.build-web.result == 'success'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: expo-web-build-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist

      - name: Setup Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Serve web app
        run: |
          npx serve -s dist -l 3000 &
          sleep 5

      - name: Run Lighthouse CI
        run: lhci autorun || echo "Lighthouse CI completed with warnings"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

  # Job 8: Deployment Summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [test-and-lint, type-check, security-audit, build-android, app-journeys, build-web, performance-test]
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "##  Grow with Freya - CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Build Status:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests & Lint**: ${{ needs.test-and-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Check**: ${{ needs.type-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Audit**: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Journeys (smoke)**: ${{ needs.app-journeys.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Build**: ${{ needs.build-web.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Tests**: ${{ needs.performance-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "###  Available Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Web build available for download (30 days retention)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if all required jobs passed
          if [[ "${{ needs.test-and-lint.result }}" == "success" && "${{ needs.type-check.result }}" == "success" && "${{ needs.build-web.result }}" != "failure" && "${{ needs.app-journeys.result }}" != "failure" ]]; then
            echo "###  EAS Build Ready" >> $GITHUB_STEP_SUMMARY
            echo "All CI checks passed! You can now trigger EAS build manually:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to **Actions** → **EAS Build (Manual)**" >> $GITHUB_STEP_SUMMARY
            echo "2. Click **Run workflow**" >> $GITHUB_STEP_SUMMARY
            echo "3. Select platform and profile" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "###  Quick Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [Repository](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- [EAS Builds](https://expo.dev/accounts/tantum-arbiter/projects/grow-with-freya/builds)" >> $GITHUB_STEP_SUMMARY
          echo "- [Trigger EAS Build](https://github.com/${{ github.repository }}/actions/workflows/deploy-eas.yml)" >> $GITHUB_STEP_SUMMARY
