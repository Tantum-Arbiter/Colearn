name: Grow with Freya - CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, mvp, develop, set-up-pipeline-frontend, fix-client-pipeline-ai ]  # Enable on main, mvp and develop branches
    paths:
      - 'grow-with-freya/**'
      - '.github/workflows/grow-with-freya-ci-cd.yml'
  pull_request:
    branches: [ main, mvp, develop ]
    paths:
      - 'grow-with-freya/**'
      - '.github/workflows/grow-with-freya-ci-cd.yml'

# CRITICAL: Prevent multiple simultaneous runs
concurrency:
  group: grow-with-freya-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: grow-with-freya
  NODE_VERSION: '20'
  EXPO_CLI_VERSION: 'latest'

jobs:
  # Job 1: Code Quality & Testing
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          echo "Dependencies installed successfully"

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        id: test_run
        run: npm run test:ci
        env:
          CI: true
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=4096'


  # Job 2: TypeScript Type Checking
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          echo "Dependencies installed successfully"

      - name: TypeScript type check
        run: npm run type-check

  # Job 3: Security & Dependency Audi
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          echo "Dependencies installed successfully"

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Audit found issues but continuing (known React version conflict)"
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || echo "Package check completed"

  # Job 4: App Journeys (Maestro on an Android emulator)
  # The layer above unit tests: the real app, on a device, doing what a family does.
  # Android because an emulator runs on a Linux runner; iOS journeys run nightly on
  # macOS (app-e2e-nightly.yml), where the minutes cost roughly ten times as much.
  app-journeys:
    name: App Journeys (smoke)
    runs-on: ubuntu-latest
    needs: [test-and-lint, type-check]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mvp' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 45
    env:
      MAESTRO_VERSION: '2.10.0'
      EXPO_PUBLIC_E2E: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM, so the emulator is not unbearably slow
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install --legacy-peer-deps

      - name: Install Maestro
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> $GITHUB_PATH

      - name: Generate the Android project
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx expo prebuild --platform android --no-install

      - name: Build the app
        working-directory: ${{ env.WORKING_DIRECTORY }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Serve the bundle
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npx expo start --dev-client --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/status | grep -q running && break
            sleep 2
          done

      - name: Run the smoke journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r grow-with-freya/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            adb shell am start -a android.intent.action.VIEW -d 'com.growwithfreya.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
            sleep 30
            cd grow-with-freya && ./.maestro/run.sh --include-tags=smoke

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.sha }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/metro.log
          retention-days: 7

  # Job 4: Build Web Application
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: [test-and-lint, type-check, security-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/set-up-pipeline-frontend')
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Expo CLI
        run: npm install -g @expo/cli@${{ env.EXPO_CLI_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo doctor check
        run: npx expo-doctor || echo "Expo doctor found issues but continuing build..."
        continue-on-error: true

      - name: Export for web
        run: npx expo export --platform web

      - name: Check the bundle can actually run
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if grep -rl "import\.meta" dist/_expo/static/js/web/ >/dev/null 2>&1; then
            echo "The web bundle contains import.meta, which a classic script cannot parse:" >&2
            echo "the app will stop at the splash. See babel.config.js unstable_transformImportMeta." >&2
            exit 1
          fi

      - name: Archive web build
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-build-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist
          retention-days: 30

  # Job 5: Performance Testing
  # Runs after web build completes
  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.build-web.result == 'success'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: expo-web-build-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist

      - name: Setup Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Serve web app
        run: |
          npx serve -s dist -l 3000 &
          sleep 5

      - name: Run Lighthouse CI
        run: lhci autorun || echo "Lighthouse CI completed with warnings"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

  # Job 6: Deployment Summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [test-and-lint, type-check, security-audit, app-journeys, build-web, performance-test]
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "##  Grow with Freya - CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Build Status:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests & Lint**: ${{ needs.test-and-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Check**: ${{ needs.type-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Audit**: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Journeys (smoke)**: ${{ needs.app-journeys.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Build**: ${{ needs.build-web.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Tests**: ${{ needs.performance-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "###  Available Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Web build available for download (30 days retention)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if all required jobs passed
          if [[ "${{ needs.test-and-lint.result }}" == "success" && "${{ needs.type-check.result }}" == "success" && "${{ needs.build-web.result }}" == "success" ]]; then
            echo "###  EAS Build Ready" >> $GITHUB_STEP_SUMMARY
            echo "All CI checks passed! You can now trigger EAS build manually:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to **Actions** → **EAS Build (Manual)**" >> $GITHUB_STEP_SUMMARY
            echo "2. Click **Run workflow**" >> $GITHUB_STEP_SUMMARY
            echo "3. Select platform and profile" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "###  Quick Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [Repository](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- [EAS Builds](https://expo.dev/accounts/tantum-arbiter/projects/grow-with-freya/builds)" >> $GITHUB_STEP_SUMMARY
          echo "- [Trigger EAS Build](https://github.com/${{ github.repository }}/actions/workflows/deploy-eas.yml)" >> $GITHUB_STEP_SUMMARY
