name: Backend checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gateway-service/**'
      - 'func-tests/**'
      - 'wiremock-server/**'
      - 'firestore-emulator/**'
      - 'contract-fixtures/**'
      - 'docker-compose.functional-tests.yml'
      - '.github/workflows/backend-checks.yml'
  push:
    branches: [main, mvp, develop]
    paths:
      - 'gateway-service/**'
      - 'func-tests/**'
      - 'wiremock-server/**'
      - 'firestore-emulator/**'
      - 'contract-fixtures/**'
      - 'docker-compose.functional-tests.yml'
      - '.github/workflows/backend-checks.yml'

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-unit-tests:
    name: Gateway unit, slice and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test, with the coverage floor
        working-directory: gateway-service
        run: ./gradlew test jacocoTestCoverageVerification --no-daemon

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-reports
          path: |
            gateway-service/build/reports/tests/test
            gateway-service/build/reports/jacoco/test
          retention-days: 14

  func-tests-with-validation-on:
    name: Func tests against a prod-configured gateway
    needs: gateway-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUCUMBER_FILTER_TAGS: 'not @ignore and not @gcp-func-only'
    steps:
      - uses: actions/checkout@v4

      - name: Run the stack
        run: |
          docker compose -f docker-compose.functional-tests.yml --profile func up \
            --build --abort-on-container-exit --exit-code-from func-tests \
            wiremock fake-gcs firestore gateway func-tests

      - name: Gateway log on failure
        if: failure()
        run: docker compose -f docker-compose.functional-tests.yml logs gateway --tail 300

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: func-test-reports
          path: func-tests/build/cucumber-reports
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.functional-tests.yml --profile func down -v
