name: Security Scan

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: advisories are published against dependencies that have not changed
    - cron: '0 6 * * 1'
  push:
    branches: [main, mvp]
    paths:
      - 'grow-with-freya/package.json'
      - 'grow-with-freya/package-lock.json'
      - 'grow-with-freya/audit-allowlist.json'
      - '.github/scripts/audit-gate.py'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'grow-with-freya/package.json'
      - 'grow-with-freya/package-lock.json'
      - 'grow-with-freya/audit-allowlist.json'
      - '.github/scripts/audit-gate.py'
      - '.github/workflows/security-scan.yml'

# CRITICAL: Prevent multiple simultaneous runs
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: grow-with-freya
  NODE_VERSION: '20'

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # npm audit reads package-lock.json; nothing is installed in this job.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit on the whole tree (informational)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          python3 ../.github/scripts/audit-summary.py "$RUNNER_TEMP/npm-audit-full.json"

      - name: Run npm audit on the production tree
        run: npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: |
            ${{ runner.temp }}/npm-audit-full.json
            ${{ runner.temp }}/npm-audit-production.json
          retention-days: 30

      # Fails on a critical advisory anywhere, or a high one in the production tree, that
      # grow-with-freya/audit-allowlist.json does not accept. Expo lists its build tooling as
      # production dependencies, so the allowlist, not --omit=dev, says what reaches the app:
      # tooling by package, shipped code by advisory id (PHASE-4-PROD-READINESS.md, section 12).
      - name: Gate on advisories the allowlist does not accept
        run: |
          python3 ../.github/scripts/audit-gate.py \
            --full "$RUNNER_TEMP/npm-audit-full.json" \
            --production "$RUNNER_TEMP/npm-audit-production.json" \
            --allowlist audit-allowlist.json

  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --json --out licenses.json
          license-checker --summary

      - name: Upload license results
        uses: actions/upload-artifact@v4
        with:
          name: license-scan-results
          path: ${{ env.WORKING_DIRECTORY }}/licenses.json
          retention-days: 30

      - name: Check for problematic licenses
        run: |
          # Check for licenses that might be problematic
          PROBLEMATIC_LICENSES="GPL-2.0,GPL-3.0,AGPL-1.0,AGPL-3.0"

          if license-checker --excludePrivatePackages --onlyAllow "MIT;ISC;BSD;Apache-2.0;Unlicense;WTFPL" --summary; then
            echo " All licenses are acceptable"
          else
            echo " Some packages have licenses that need review"
            license-checker --excludePrivatePackages --failOn "$PROBLEMATIC_LICENSES" || echo "Found potentially problematic licenses"
          fi

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with detailed output
        run: |
          npx eslint . --ext .ts,.tsx,.js,.jsx --format json --output-file eslint-results.json || true
          npx eslint . --ext .ts,.tsx,.js,.jsx

      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results
          path: ${{ env.WORKING_DIRECTORY }}/eslint-results.json
          retention-days: 30

      - name: Run TypeScript compiler
        run: npx tsc --noEmit --pretty

      - name: Generate code metrics
        run: |
          # Count lines of code
          find . -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" | grep -v node_modules | xargs wc -l > code-metrics.txt

          # Count test files
          find . -name "*.test.*" -o -name "*.spec.*" | grep -v node_modules | wc -l > test-count.txt

          echo "Code Metrics:"
          cat code-metrics.txt | tail -1
          echo "Test Files:"
          cat test-count.txt

      - name: Upload code metrics
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: |
            ${{ env.WORKING_DIRECTORY }}/code-metrics.txt
            ${{ env.WORKING_DIRECTORY }}/test-count.txt
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, license-scan, code-quality]
    if: always()

    steps:
      - name: Create security summary
        run: |
          echo "##  Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Scan Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Scan**: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **License Scan**: ${{ needs.license-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Security audit results" >> $GITHUB_STEP_SUMMARY
          echo "- License scan results" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint results" >> $GITHUB_STEP_SUMMARY
          echo "- Code metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Quick Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [Repository](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
