name: App Journeys - Nightly

# The smoke subset runs per push in the main pipeline, on Android only.
# This is the rest: every flow, on both platforms, once a night — iOS lives
# here because macOS runners cost roughly ten times as much per minute.
# Both pipelines test the same E2E build of a given source (app-e2e-build.yml),
# so a night with no app changes reuses the app instead of building it again.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to run
        type: choice
        default: both
        options: [both, android, ios]
      tags:
        description: Only flows with these tags (blank runs every flow)
        type: string
        default: ''

concurrency:
  group: app-journeys-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android app
    if: github.event_name == 'schedule' || inputs.platform == 'both' || inputs.platform == 'android'
    uses: ./.github/workflows/app-e2e-build.yml
    with:
      platform: android

  android:
    name: Android
    needs: [build-android]
    uses: ./.github/workflows/app-e2e-journeys.yml
    with:
      platform: android
      app-key: ${{ needs.build-android.outputs.app-key }}
      tags: ${{ inputs.tags }}

  build-ios:
    name: iOS app
    if: github.event_name == 'schedule' || inputs.platform == 'both' || inputs.platform == 'ios'
    uses: ./.github/workflows/app-e2e-build.yml
    with:
      platform: ios

  ios:
    name: iOS
    needs: [build-ios]
    uses: ./.github/workflows/app-e2e-journeys.yml
    with:
      platform: ios
      app-key: ${{ needs.build-ios.outputs.app-key }}
      tags: ${{ inputs.tags }}

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-android, android, build-ios, ios]
    if: always()

    steps:
      - name: Write the summary
        run: |
          echo "## App journeys, nightly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Android**: build ${{ needs.build-android.result }}, journeys ${{ needs.android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS**: build ${{ needs.build-ios.result }}, journeys ${{ needs.ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Recordings and screenshots from a failed flow are attached to this run." >> $GITHUB_STEP_SUMMARY
